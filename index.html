<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Manga Trace Utility</title>
    
    <!-- PWA & Mobile Standalone System Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MangaTrace">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Embedded SVG App Icon (No external image files required) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' width='192' height='192'><rect width='100' height='100' rx='22' fill='%23222222'/><path d='M30 25 L45 25 L35 75 L20 75 Z' fill='%23007bff'/><path d='M55 25 L80 25 L70 75 L45 75 Z' fill='%2328a745' opacity='0.8'/><circle cx='50' cy='50' r='8' fill='%23ffffff'/></svg>">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23222222'/><path d='M30 25 L45 25 L35 75 L20 75 Z' fill='%23007bff'/><path d='M55 25 L80 25 L70 75 L45 75 Z' fill='%2328a745' opacity='0.8'/><circle cx='50' cy='50' r='8' fill='%23ffffff'/></svg>">

    <style>
        /* Absolute environment lockdown to completely neutralize mobile system gestures */
        html, body { 
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden;
            position: fixed; 
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        #controls { 
            padding: 15px; 
            padding-top: max(15px, env(safe-area-inset-top)); /* Handles notched phone screens */
            background: #1a1a1a; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            box-sizing: border-box;
            height: auto;
            border-bottom: 1px solid #2d2d2d;
        }
        
        .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        
        .upload-label {
            background: #3a3a3c;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #48484a;
            box-sizing: border-box;
        }
        .upload-label:active { background: #2c2c2e; }

        button { 
            background: #007aff; 
            color: #ffffff; 
            border: none; 
            padding: 12px 18px; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 600;
            box-sizing: border-box;
        }
        button:active { background: #0056b3; }
        
        #workspace { 
            position: relative; 
            width: 100vw; 
            flex-grow: 1;
            background: #000000;
        }
        
        /* Layout flex calculation to preserve maximum utility canvas height */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        
        video, canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            touch-action: none;
        }
        
        #lockOverlay { 
            display: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.01); 
            z-index: 99999; 
            touch-action: none;
        }
        
        #unlockBtn { 
            display: none; 
            position: absolute; 
            top: max(20px, env(safe-area-inset-top)); 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 100000; 
            padding: 12px 28px; 
            background: rgba(255, 59, 48, 0.95); 
            border: 1px solid #ff453a;
            border-radius: 25px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            font-size: 14px;
            font-weight: 500;
            color: #eaeaea;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: #007aff;
            height: 6px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="controls">
            <div class="row">
                <input type="file" id="upload" accept="image/*" style="display: none;">
                <label for="upload" class="upload-label">
                    <span>📂</span> Upload Panel
                </label>
                <button id="toggleMode">Use Camera</button>
            </div>
            <div class="row">
                <div class="slider-container">
                    <span>Opacity</span>
                    <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="0.5">
                </div>
                <button id="lockBtn" style="background: #34c759; min-width: 130px;">FREEZE SCREEN</button>
            </div>
        </div>

        <div id="workspace">
            <video id="webcam" autoplay playsinline muted style="display:none;"></video>
            <canvas id="canvas"></canvas>
            <div id="lockOverlay"></div>
        </div>
    </div>
    
    <button id="unlockBtn">HOLD 2s TO UNLOCK</button>

    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('webcam');
        const toggleMode = document.getElementById('toggleMode');
        const opacitySlider = document.getElementById('opacity');
        const lockBtn = document.getElementById('lockBtn');
        const lockOverlay = document.getElementById('lockOverlay');
        const unlockBtn = document.getElementById('unlockBtn');
        const controls = document.getElementById('controls');

        let img = new Image();
        let mode = 'lightbox';
        let stream = null;
        let isLocked = false;

        // Functional event execution blocker for full lock stability
        function killGesture(e) {
            if (isLocked) {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
            }
        }

        // Apply strict application level listeners
        window.addEventListener('touchstart', killGesture, { passive: false });
        window.addEventListener('touchmove', killGesture, { passive: false });
        window.addEventListener('touchend', killGesture, { passive: false });
        window.addEventListener('gesturestart', killGesture, { passive: false });

        function resize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            draw();
        }
        window.addEventListener('resize', resize);
        // Step layout buffers to accommodate instant CSS rendering engines
        setTimeout(resize, 50);
        setTimeout(resize, 250);

        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => { 
                    img.src = event.target.result; 
                };
                reader.readAsDataURL(file);
            }
        });

        img.onload = draw;
        opacitySlider.addEventListener('input', draw);

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!img.src) {
                ctx.fillStyle = "#8e8e93";
                ctx.font = "16px -apple-system, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Tap 'Upload Panel' to load a sketch", canvas.width / 2, canvas.height / 2);
                return;
            }

            ctx.globalAlpha = parseFloat(opacitySlider.value);
            
            const wrh = img.width / img.height;
            let newWidth = canvas.width;
            let newHeight = newWidth / wrh;
            if (newHeight > canvas.height) {
                newHeight = canvas.height;
                newWidth = newHeight * wrh;
            }
            const x = (canvas.width - newWidth) / 2;
            const y = (canvas.height - newHeight) / 2;
            
            ctx.drawImage(img, x, y, newWidth, newHeight);
        }

        toggleMode.addEventListener('click', async () => {
            if (mode === 'lightbox') {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment", frameRate: { ideal: 30 } } 
                    });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    mode = 'camera';
                    toggleMode.style.background = '#545456';
                    toggleMode.innerText = "Use Light Box";
                } catch (err) {
                    alert("Camera framework access was denied.");
                }
            } else {
                if (stream) stream.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
                mode = 'lightbox';
                toggleMode.style.background = '#007aff';
                toggleMode.innerText = "Use Camera";
            }
            draw();
        });

        // Activate Lock State Routine
        lockBtn.addEventListener('click', () => {
            if (!img.src) {
                alert("Please upload a sketch before freezing the workspace.");
                return;
            }
            isLocked = true;
            lockOverlay.style.display = 'block';
            unlockBtn.style.display = 'block';
            controls.style.display = 'none';
            resize();
        });

        // Safe Unlock long press timer engine
        let unlockTimeout;
        
        unlockBtn.addEventListener('touchstart', (e) => {
            e.stopPropagation(); 
            unlockBtn.style.background = "rgba(255, 59, 48, 1)";
            unlockBtn.innerText = "HOLDING...";
            unlockTimeout = setTimeout(() => {
                isLocked = false;
                lockOverlay.style.display = 'none';
                unlockBtn.style.display = 'none';
                unlockBtn.innerText = "HOLD 2s TO UNLOCK";
                unlockBtn.style.background = "rgba(255, 59, 48, 0.95)";
                controls.style.display = 'flex';
                resize();
            }, 2000); 
        }, { passive: false });

        window.addEventListener('touchend', () => {
            clearTimeout(unlockTimeout);
            if (isLocked) {
                unlockBtn.innerText = "HOLD 2s TO UNLOCK";
                unlockBtn.style.background = "rgba(255, 59, 48, 0.95)";
            }
        });
    </script>
</body>
</html>
